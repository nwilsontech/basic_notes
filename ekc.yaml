#!/bin/bash

set -e

# ==== CONFIGURATION ====
EXTERNAL_IP=$(curl -s https://api.ipify.org)   # or set manually: EXTERNAL_IP="1.2.3.4"
K3S_VERSION="v1.29.4+k3s1"
RANCHER_VERSION="v2.8.2"
RANCHER_NAMESPACE="cattle-system"
INSTALL_K3S_EXEC="--tls-san $EXTERNAL_IP --disable traefik"

echo "[+] Installing K3s with external access on IP: $EXTERNAL_IP"

# ==== INSTALL K3S ====
curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="$INSTALL_K3S_EXEC" INSTALL_K3S_VERSION=$K3S_VERSION sh -

# Wait for K3s to be ready
echo "[+] Waiting for K3s node to be ready..."
sleep 10
kubectl wait --for=condition=Ready nodes --timeout=90s

# ==== INSTALL CERT-MANAGER ====
echo "[+] Installing cert-manager..."
kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.yaml
kubectl wait --namespace cert-manager --for=condition=Available deployment/cert-manager-webhook --timeout=120s

# ==== INSTALL RANCHER ====
echo "[+] Creating namespace for Rancher..."
kubectl create namespace $RANCHER_NAMESPACE || true

echo "[+] Adding Rancher Helm repo..."
helm repo add rancher-latest https://releases.rancher.com/server-charts/latest
helm repo update

echo "[+] Installing Rancher via Helm..."
helm install rancher rancher-latest/rancher \
  --namespace $RANCHER_NAMESPACE \
  --set hostname="$EXTERNAL_IP" \
  --set replicas=1 \
  --set ingress.tls.source=auto \
  --version $RANCHER_VERSION

echo "[+] Waiting for Rancher deployment..."
kubectl -n $RANCHER_NAMESPACE rollout status deploy/rancher --timeout=180s

# ==== GET ACCESS ====
echo "[+] Rancher installed successfully!"
echo "========================================="
echo "Access Rancher at: https://$EXTERNAL_IP"
echo "Initial admin password:"
kubectl get secret -n $RANCHER_NAMESPACE bootstrap-secret -o jsonpath="{.data.bootstrapPassword}" | base64 -d; echo
echo "========================================="
